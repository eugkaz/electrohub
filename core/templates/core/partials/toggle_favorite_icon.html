{% load i18n %}
{% load static %}

{# Унікальний ID для оновлення через HTMX, включаючи source #}
<div id="favorite-icon-product-{{ product.id }}-{{ source|default:'list' }}">
    <button type="button"
            {# --- Використовуємо простір імен 'core' --- #}
            hx-post="{% url 'toggle_favorite' product.id %}?source={{ source|default:'unknown' }}"
            hx-target="this"
            hx-swap="outerHTML"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            class="p-1.5 rounded-full bg-white/80 text-gray-400 hover:text-yellow-500 hover:bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-yellow-500 backdrop-blur-sm transition-all duration-200"
            title="{% if is_favorite %}{% trans 'Видалити з обраного' %}{% else %}{% trans 'Додати в обране' %}{% endif %}">

        <span class="sr-only">{% if is_favorite %}{% trans "Видалити з обраного" %}{% else %}{% trans "Додати в обране" %}{% endif %}</span>

        {% if is_favorite %}
            {# Іконка Заповненого серця #}
            <svg class="w-5 h-5 text-yellow-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
            </svg>
        {% else %}
            {# Іконка Порожнього серця #}
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>
        {% endif %}
    </button>
</div>
