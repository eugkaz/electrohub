{% load i18n %}
{% load static %}

{# Унікальний ID для оновлення через HTMX #}
<div id="favorite-button-product-{{ product.id }}">
  <button type="button"
          hx-post="{% url 'toggle_favorite' product.id %}?source={{ source|default:'product_detail' }}" {# Використовуємо source=product_detail #}
          hx-target="this"
          hx-swap="outerHTML"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition-colors duration-150
                 {% if is_favorite %} bg-yellow-50 text-yellow-600 hover:bg-yellow-100 border-yellow-200
                 {% else %} bg-white text-gray-700 hover:bg-gray-50 {% endif %}">
    {% if is_favorite %}
      <svg class="-ml-1 mr-2 h-5 w-5 text-yellow-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"> <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" /> </svg>
      {% trans "В обраному" %}
    {% else %}
      <svg class="-ml-1 mr-2 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"> <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" /> </svg>
      {% trans "Додати в обране" %}
    {% endif %}
  </button>
</div>
