{% load i18n %}
{% load static %} {# Если используете static для иконок, которых нет в FontAwesome #}

{# Контекст: listing, is_favorite, request, source (опционально) #}
<button type="button"
        hx-post="{% url 'toggle_favorite_listing' listing.id %}?source={{ source|default:'list' }}"
        hx-target="this"
        hx-swap="outerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        title="{% if is_favorite %}{% trans 'Видалити з обраного' %}{% else %}{% trans 'Додати в обране' %}{% endif %}"
        class="p-2 rounded-full {% if is_favorite %}bg-yellow-100/80 text-yellow-600 hover:bg-yellow-200/80 ring-1 ring-yellow-400{% else %}bg-white/80 text-gray-400 hover:text-yellow-500 hover:bg-white{% endif %} focus:outline-none focus-visible:ring-2 focus-visible:ring-yellow-500 backdrop-blur-sm transition-all duration-200 opacity-90 hover:opacity-100">
    <span class="sr-only">{% trans "Обране" %}</span>
    <span id="fav-indicator-{{ listing.id }}"> {# Обертка для иконки, чтобы индикатор не заменял ее #}
        {% if is_favorite %}
            <svg class="w-5 h-5 text-yellow-500" viewBox="0 0 20 20" fill="currentColor">
                <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" />
            </svg>
        {% else %}
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>
        {% endif %}
    </span>
    <span id="fav-spinner-{{ listing.id }}" class="htmx-indicator">
        <svg class="animate-spin h-5 w-5 text-yellow-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </span>
</button>
