{% load i18n %}
{% load static %} {# Для CSRF скрипту #}

{# --- Контейнер для кнопки та можливих повідомлень --- #}
<div class="add-to-cart-container-{{ product.id }}">
    {% if product.in_stock %}
        <button type="button"
                hx-post="{% url 'cart:add_to_cart' product.id %}" {# Переконайся, що URL правильний #}
                {# Можна додати таргет для повідомлення або індикатора #}
                hx-target="#cart-message-{{ product.id }}"
                hx-swap="innerHTML" {# Замінити вміст таргету #}
                {# hx-indicator="#loading-indicator-{{ product.id }}" #}
                {# hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' - Не потрібно, якщо є глобальний скрипт #}
                class="w-full flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-lg transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-1
                       {% if style == 'primary' %} bg-gray-900 text-white hover:bg-gray-800 focus-visible:ring-gray-900
                       {% elif style == 'secondary' %} text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 hover:text-gray-900 hover:border-gray-400 focus-visible:ring-yellow-400
                       {% else %} bg-yellow-400 text-gray-900 hover:bg-yellow-500 focus-visible:ring-yellow-500 {% endif %}"> {# За замовчуванням жовтий #}
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            {% trans "В кошик" %}
        </button>
    {% else %}
        <button type="button" disabled
                class="w-full flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-lg cursor-not-allowed
                       {% if style == 'primary' %} bg-gray-300 text-gray-500
                       {% elif style == 'secondary' %} text-gray-400 bg-gray-100 border border-gray-200
                       {% else %} bg-gray-200 text-gray-500 {% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" /></svg>
            {% trans "Немає в наявності" %}
        </button>
    {% endif %}
     {# Місце для повідомлення від HTMX #}
    <span id="cart-message-{{ product.id }}" class="text-xs text-green-600 mt-1 block h-4"></span>
     {# Індикатор завантаження (прихований за замовчуванням) #}
     {# <span id="loading-indicator-{{ product.id }}" class="htmx-indicator text-xs text-gray-500">{% trans "Додавання..." %}</span> #}
</div>
