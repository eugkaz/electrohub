{% if related_topics %}
    <div class="bg-white p-5 rounded-xl shadow-lg border border-gray-200/75">
        <h3 class="text-base font-semibold text-gray-900 mb-4 border-b border-gray-200 pb-2.5 flex items-center gap-x-2">
            <svg class="w-4 h-4 text-yellow-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 01-2.25 2.25M16.5 7.5V18a2.25 2.25 0 002.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 002.25 2.25h13.5M6 7.5h3v3H6v-3z" /> </svg>
            {% if current_topic.category %}
                Інші теми в "{{ current_topic.category.name }}"
            {% else %}
                Схожі теми
            {% endif %}
        </h3>
        <ul class="space-y-2.5">
            {% for related_topic in related_topics %}
                <li class="text-sm leading-tight">
                    <a href="{% url 'topic-detail' related_topic.id %}" class="font-medium text-gray-800 hover:text-yellow-700 line-clamp-2 transition-colors duration-150" title="{{ related_topic.title }}">
                        {{ related_topic.title }}
                    </a>
                    <div class="text-xs text-gray-500 mt-0.5">{{ related_topic.last_activity|timesince }} тому</div>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
