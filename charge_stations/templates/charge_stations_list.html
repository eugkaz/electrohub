{% for station in stations %}
    <div class="station">
        <h3>{{ station.name }}</h3>
        <p>{{ station.description }}</p>
        <p><strong>Координаты:</strong> {{ station.location.y }}, {{ station.location.x }}</p>
    </div>
{% empty %}
    <p>Нет доступных зарядных станций</p>
{% endfor %}
